# The cert-manager issuer that ingress.yaml names (cert-manager.io/cluster-issuer: letsencrypt).
# Needs cert-manager installed (helm install cert-manager jetstack/cert-manager
# -n cert-manager --create-namespace --set crds.enabled=true) and the DNS name
# already pointing at the ingress controller, because the challenge is HTTP-01.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: CHANGE-ME@example.com
    privateKeySecretRef:
      name: letsencrypt-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: nginx
