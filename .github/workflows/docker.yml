name: Docker

# Builds the CPU image, boots it with a Kokoro preload and synthesizes speech
# through a client key; on pushes to main and on v* tags the image goes to
# ghcr.io/<owner>/voicebox:<tag>-cpu. Tags also publish the CUDA image.

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - Dockerfile
      - .dockerignore
      - backend/**
      - app/**
      - web/**
      - package.json
      - bun.lock
      - docker-compose*.yml
      - scripts/docker-smoke.sh
      - scripts/rocm-entrypoint.sh
      - .github/workflows/docker.yml
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - backend/**
      - web/**
      - docker-compose*.yml
      - scripts/docker-smoke.sh
      - .github/workflows/docker.yml
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  cpu:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Free disk space (the image and its build cache need ~10 GB)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: docker/setup-buildx-action@v3

      - name: Build the CPU image
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: PYTORCH_VARIANT=cpu
          load: true
          tags: voicebox:ci
          cache-from: type=gha,scope=cpu
          cache-to: type=gha,mode=max,scope=cpu

      - name: Smoke test (boot, preload Kokoro, stream speech, graceful stop)
        run: scripts/docker-smoke.sh voicebox:ci

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        if: github.event_name == 'push'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: suffix=-cpu
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Push the CPU image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: PYTORCH_VARIANT=cpu
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=cpu

  cuda:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Free disk space (the CUDA image is ~8 GB)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: suffix=-cu128
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build and push the CUDA image
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: PYTORCH_VARIANT=cu128
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=cu128
          cache-to: type=gha,mode=max,scope=cu128
