name: Speech reliability

# Model downloads and real audio make this deliberately separate from fast PR CI.
on:
  workflow_dispatch:
    inputs:
      duration:
        description: Minimum seconds per integration in each of two restart passes
        type: number
        default: 180
  schedule:
    - cron: '23 7 * * 1'

permissions:
  contents: read

concurrency:
  group: speech-reliability-${{ github.ref }}
  cancel-in-progress: false

jobs:
  conversation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Free disk for the CPU image
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: docker/setup-buildx-action@v3
      - name: Build this checkout's CPU server
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: PYTORCH_VARIANT=cpu
          load: true
          tags: voicebox:reliability
          cache-from: type=gha,scope=cpu
      - name: Install separate integration environments
        run: |
          python -m venv /tmp/livekit
          python -m venv /tmp/pipecat
          /tmp/livekit/bin/pip install -r integrations/livekit/requirements.txt
          /tmp/pipecat/bin/pip install -r integrations/pipecat/requirements.txt
          /tmp/livekit/bin/python integrations/livekit/agent.py download-files
      - name: Repeated conversations, barge-in, idle reconnect and server restart
        env:
          SOAK_DURATION: ${{ inputs.duration || 180 }}
        run: >-
          python scripts/run_speech_reliability.py --image voicebox:reliability
          --livekit-python /tmp/livekit/bin/python --pipecat-python /tmp/pipecat/bin/python
          --duration "$SOAK_DURATION" --out-dir artifacts
      - name: Upload reports and synthetic recordings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: speech-reliability
          path: artifacts/
          include-hidden-files: false
          retention-days: 7
