name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  frontend-quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck app + web
        run: bun run typecheck

      - name: Build web smoke test
        run: bun run build:web

  backend-quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-ci.txt

      - name: Install test dependencies (no torch)
        run: pip install -r backend/requirements-ci.txt

      - name: Lint and format check (ruff, listed paths)
        run: |
          grep -v '^#' backend/ruff-clean-paths.txt | xargs ruff check
          grep -v '^#' backend/ruff-clean-paths.txt | xargs ruff format --check

      - name: Torch-free tests
        run: grep -v '^#' backend/tests/torch-free.txt | xargs python -m pytest -q -p no:cacheprovider
