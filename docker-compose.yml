# Voicebox — CPU build (default)
# For AMD ROCm GPU acceleration use the overlay:
#   docker compose -f docker-compose.yml -f docker-compose.rocm.yml up --build

services:
  voicebox:
    build: .
    container_name: voicebox
    restart: unless-stopped

    ports:
      # Host-side moved to 17600 so the dev/installed Voicebox can keep 17493.
      # Container still listens on its native port internally.
      - "127.0.0.1:17600:17493"

    volumes:
      # Bind-mount for generated audio (customize the host path as needed)
      # Host side:      ./output/
      # Container side: /app/data/generations/
      - ./output:/app/data/generations

      # Named volume for profiles, DB, cache (persists across container restarts)
      - voicebox-data:/app/data

      # HuggingFace model cache (so models aren't re-downloaded on rebuild)
      - huggingface-cache:/home/voicebox/.cache/huggingface

    environment:
      - LOG_LEVEL=info
      - NUMBA_CACHE_DIR=/tmp/numba_cache
      # Every endpoint needs an API key. Export VOICEBOX_API_KEY on the host
      # (e.g. `export VOICEBOX_API_KEY=$(openssl rand -base64 32)`) to set the
      # admin key; leave it unset and the server creates one in the data
      # volume, readable with `docker compose exec voicebox cat /app/data/api_key`.
      - VOICEBOX_API_KEY
      # Set to 1 to remove the interactive API docs on a headless server.
      - VOICEBOX_DISABLE_DOCS
      # Comma-separated browser origins that may call the API directly.
      - VOICEBOX_CORS_ORIGINS

    security_opt:
      - no-new-privileges:true

    networks:
      - voicebox-net

    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G

networks:
  voicebox-net:
    driver: bridge

volumes:
  voicebox-data:
  huggingface-cache:
